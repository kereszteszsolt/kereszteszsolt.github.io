<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.seo_title | default: site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="author" content="{{ site.author.name | escape }}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ site.seo_title | default: site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ site.social_image | absolute_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.social_image_alt | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ site.seo_title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ site.description | escape }}">
    <meta name="twitter:image" content="{{ site.social_image | absolute_url }}">
    <meta name="twitter:image:alt" content="{{ site.social_image_alt | escape }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": {{ site.title | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "description": {{ site.description | jsonify }},
        "inLanguage": {{ site.lang | jsonify }},
        "creator": {
          "@type": "Person",
          "name": {{ site.author.name | jsonify }},
          "url": {{ site.author.url | jsonify }},
          "sameAs": [{{ site.author.github | jsonify }}]
        }
      }
    </script>
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}" sizes="any">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      :root {
        color-scheme: light;
        --page-background: #fff;
        --page-text: #1f2328;
        --page-link: #0969da;
        --page-border: #d1d9e0;
        --page-alternate: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --page-background: #0d1117;
          --page-text: #f0f6fc;
          --page-link: #79c0ff;
          --page-border: #3d444d;
          --page-alternate: #151b23;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-background: #0d1117;
        --page-text: #f0f6fc;
        --page-link: #79c0ff;
        --page-border: #3d444d;
        --page-alternate: #151b23;
      }
      body { color: var(--page-text); background: var(--page-background); }
      main.markdown-body { max-width: 860px; }
      .markdown-body h1 img { display: block; max-width: 100%; height: auto; }
      .markdown-body { color: var(--page-text); }
      .markdown-body img { max-width: 100%; height: auto; background: transparent; }
      .markdown-body a { color: var(--page-link); text-underline-offset: 3px; }
      .markdown-body h1, .markdown-body h2,
      .markdown-body table th, .markdown-body table td,
      .markdown-body table tr { border-color: var(--page-border); }
      .markdown-body table tr { background: var(--page-background); }
      .markdown-body table tr:nth-child(2n) { background: var(--page-alternate); }
      .markdown-body hr { background: var(--page-border); }
      .markdown-body blockquote { color: var(--page-text); border-color: var(--page-border); }
      .markdown-body a:focus-visible, .theme-controls select:focus-visible {
        outline: 2px solid var(--page-link);
        outline-offset: 4px;
      }
      .theme-controls { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 16px; }
      .theme-controls[hidden] { display: none; }
      .theme-controls select {
        min-height: 44px;
        padding: 8px;
        border: 1px solid var(--page-border);
        border-radius: 6px;
        color: var(--page-text);
        background: var(--page-background);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="container-lg px-3 my-5 markdown-body">
      <div class="theme-controls" hidden>
        <label for="theme">Theme</label>
        <select id="theme" autocomplete="off">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      {{ content }}
    </main>
    <script>
      const themeSelect = document.getElementById('theme');
      themeSelect.value = 'system';
      themeSelect.addEventListener('change', () => {
        document.documentElement.dataset.theme = themeSelect.value;
      });
      document.querySelector('.theme-controls').hidden = false;
    </script>
  </body>
</html>
