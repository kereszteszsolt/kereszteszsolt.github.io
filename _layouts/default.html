<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      :root {
        color-scheme: light;
        --page-background: #fff;
        --page-text: #1f2328;
        --page-link: #0969da;
        --page-border: #d1d9e0;
        --page-alternate: #f6f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --page-background: #0d1117;
          --page-text: #f0f6fc;
          --page-link: #79c0ff;
          --page-border: #3d444d;
          --page-alternate: #151b23;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-background: #0d1117;
        --page-text: #f0f6fc;
        --page-link: #79c0ff;
        --page-border: #3d444d;
        --page-alternate: #151b23;
      }
      body { color: var(--page-text); background: var(--page-background); }
      main.markdown-body { max-width: 860px; }
      .markdown-body { color: var(--page-text); }
      .markdown-body img { max-width: 100%; height: auto; background: transparent; }
      .markdown-body a { color: var(--page-link); text-underline-offset: 3px; }
      .markdown-body h1, .markdown-body h2,
      .markdown-body table th, .markdown-body table td,
      .markdown-body table tr { border-color: var(--page-border); }
      .markdown-body table tr { background: var(--page-background); }
      .markdown-body table tr:nth-child(2n) { background: var(--page-alternate); }
      .markdown-body hr { background: var(--page-border); }
      .markdown-body blockquote { color: var(--page-text); border-color: var(--page-border); }
      .markdown-body a:focus-visible, .theme-controls select:focus-visible {
        outline: 2px solid var(--page-link);
        outline-offset: 4px;
      }
      .theme-controls { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 16px; }
      .theme-controls[hidden] { display: none; }
      .theme-controls select {
        min-height: 44px;
        padding: 8px;
        border: 1px solid var(--page-border);
        border-radius: 6px;
        color: var(--page-text);
        background: var(--page-background);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="container-lg px-3 my-5 markdown-body">
      <div class="theme-controls" hidden>
        <label for="theme">Theme</label>
        <select id="theme" autocomplete="off">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      {{ content }}
    </main>
    <script>
      const themeSelect = document.getElementById('theme');
      themeSelect.value = 'system';
      themeSelect.addEventListener('change', () => {
        document.documentElement.dataset.theme = themeSelect.value;
      });
      document.querySelector('.theme-controls').hidden = false;
    </script>
  </body>
</html>
